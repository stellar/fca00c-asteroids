[workspace]
resolver = "2"

members = [
    "contracts/_game_engine",
    "contracts/solution"
]

[workspace.dependencies.soroban-sdk]
version = "27.0.6"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true